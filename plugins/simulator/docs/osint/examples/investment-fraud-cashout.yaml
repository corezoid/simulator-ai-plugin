# Invented case. A fake investment site takes deposits through money mules,
# converts them to a stablecoin, moves the coins through three wallets and
# cashes out through an over-the-counter desk into a car.
case:
  id: investment-fraud-cashout
  title: Brightvale Invest deposits
  question: Where did the money paid to Brightvale Invest go, and who ended up with it?
  synthetic: true
  currency: USD
  note: Every person, company, wallet, domain and payment here is invented.

sources:
  - {id: s-victims, title: Victim statements and payment receipts, kind: human, reliability: B}
  - {id: s-bank, title: Bank statements of the mule accounts, kind: bank, reliability: A}
  - {id: s-exchange, title: Exchange account records, kind: corporate, reliability: B}
  - {id: s-chain, title: Public blockchain explorer, kind: blockchain, reliability: A, url: "https://explorer.example", retrieved: 2025-07-01}
  - {id: s-whois, title: Domain registration records, kind: registry, reliability: C, retrieved: 2025-06-28}
  - {id: s-dealer, title: Car dealer sales ledger, kind: corporate, reliability: B}
  - {id: s-tip, title: Messages from a former mule, kind: human, reliability: D}

