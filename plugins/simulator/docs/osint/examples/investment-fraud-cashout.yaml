  - {id: d02, from: acc-v1, to: acc-mule1, amount: 9800, date: 2025-03-05, purpose: investment top-up, sources: [s-victims, s-bank], credibility: 1}
  - {id: d03, from: acc-v2, to: acc-mule1, amount: 9200, date: 2025-03-04, purpose: investment deposit, sources: [s-victims, s-bank], credibility: 1}
  - {id: d04, from: acc-v2, to: acc-mule1, amount: 9700, date: 2025-03-06, purpose: investment top-up, sources: [s-victims, s-bank], credibility: 1}
  - {id: d05, from: acc-v3, to: acc-mule2, amount: 9900, date: 2025-03-03, purpose: investment deposit, sources: [s-victims, s-bank], credibility: 1}
  - {id: d06, from: acc-v3, to: acc-mule2, amount: 9400, date: 2025-03-06, purpose: investment top-up, sources: [s-victims, s-bank], credibility: 1}
  - {id: d07, from: acc-v4, to: acc-mule2, amount: 9600, date: 2025-03-04, purpose: investment deposit, sources: [s-victims, s-bank], credibility: 1}
  - {id: d08, from: acc-v4, to: acc-mule2, amount: 9300, date: 2025-03-07, purpose: investment top-up, sources: [s-victims, s-bank], credibility: 1}
  - {id: d09, from: acc-v5, to: acc-mule3, amount: 9800, date: 2025-03-05, purpose: investment deposit, sources: [s-victims, s-bank], credibility: 1}
  - {id: d10, from: acc-v5, to: acc-mule3, amount: 9100, date: 2025-03-07, purpose: investment top-up, sources: [s-victims, s-bank], credibility: 1}
  - {id: d11, from: acc-v6, to: acc-mule3, amount: 9700, date: 2025-03-06, purpose: investment deposit, sources: [s-victims, s-bank], credibility: 1}
  - {id: d12, from: acc-v6, to: acc-mule3, amount: 9500, date: 2025-03-08, purpose: investment top-up, sources: [s-victims, s-bank], credibility: 1}
  # the mules keep 5 % and buy stablecoin at the exchange
  - {id: m1, from: acc-mule1, to: acc-exchange-usd, amount: 36290, date: 2025-03-07, purpose: purchase of USDT, sources: [s-bank, s-exchange], credibility: 1}
  - {id: m2, from: acc-mule2, to: acc-exchange-usd, amount: 36290, date: 2025-03-08, purpose: purchase of USDT, sources: [s-bank, s-exchange], credibility: 1}
  - {id: m3, from: acc-mule3, to: acc-exchange-usd, amount: 36195, date: 2025-03-09, purpose: purchase of USDT, sources: [s-bank, s-exchange], credibility: 1}
  # the exchange sends the coins to one withdrawal address
  - {id: x1, from: acc-exchange-usdt, to: w-org, amount: 36100, date: 2025-03-07, purpose: withdrawal, sources: [s-exchange, s-chain], credibility: 1}
  - {id: x2, from: acc-exchange-usdt, to: w-org, amount: 36100, date: 2025-03-08, purpose: withdrawal, sources: [s-exchange, s-chain], credibility: 1}
  - {id: x3, from: acc-exchange-usdt, to: w-org, amount: 36000, date: 2025-03-09, purpose: withdrawal, sources: [s-exchange, s-chain], credibility: 1}
  # three hops on chain
  - {id: c1, from: w-org, to: w1, amount: 108000, date: 2025-03-10, sources: [s-chain], credibility: 1}
  - {id: c2, from: w1, to: w2, amount: 107900, date: 2025-03-10, sources: [s-chain], credibility: 1}
  - {id: c3, from: w2, to: w-otc, amount: 107800, date: 2025-03-11, sources: [s-chain], credibility: 1}
  # cash-out: the desk pays the dealer on the buyer's behalf
  - {id: o1, from: acc-otc, to: acc-dealer, amount: 105000, date: 2025-04-02, purpose: "payment for K. Drohl, sales order 2025-0412", sources: [s-dealer], credibility: 2}

events:
  - {id: e1, date: 2025-01-09, title: The domain brightvale-invest.example is registered, entities: [site], sources: [s-whois], credibility: 1}
  - {id: e2, date: 2025-02-20, title: The first of three mule accounts is opened, entities: [mule1], sources: [s-bank], credibility: 1}
  - {id: e3, date: 2025-03-12, title: The site stops answering and withdrawals are refused, entities: [platform, site], sources: [s-victims], credibility: 1}
  - {id: e4, date: 2025-04-03, title: Kessan Drohl takes delivery of a sports coupe, entities: [organizer, car, dealer], sources: [s-dealer], credibility: 1}

hypotheses:
  - id: h1
    statement: The deposits were split to stay under the 10 000 reporting threshold and collected through three recruited account holders.
    status: supported
    evidence: [d01, d02, d03, d04, d05, d06, d07, d08, d09, d10, d11, d12, m1, m2, m3]
  - id: h2
    statement: Kessan Drohl controls Brightvale Invest.
    status: open
    evidence: [r-controls, r-site-org, r-phone2, w-org]
    note: Rests on one former mule (D) and on the exchange naming Drohl as holder of the withdrawal wallet.
  - id: h3
    statement: The car was bought with the victims' money.
    status: open
    evidence: [c1, c2, c3, o1, r-car]
    note: The chain is unbroken on the blockchain, but who holds wallets W1 and W2 is not established.
