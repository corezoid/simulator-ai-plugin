  - {id: l1, from: acc-quillon, to: acc-importer, amount: 240000, date: 2025-03-18, purpose: loan QTF-L-09 tranche 1, sources: [s-bank], credibility: 1}
  # second shipment, the same pattern
  - {id: p2, from: acc-importer, to: acc-trader, amount: 480000, date: 2025-04-10, purpose: invoice TC-2025-047, sources: [s-bank], credibility: 1}
  - {id: g2, from: acc-trader, to: acc-farm, amount: 184000, date: 2025-04-11, purpose: wheat purchase, sources: [s-corr], credibility: 2}
  - {id: f2, from: acc-trader, to: acc-shipping, amount: 38000, date: 2025-04-11, purpose: freight MV Avel Tern, sources: [s-corr], credibility: 2}
  - {id: k2, from: acc-trader, to: acc-reef, amount: 248000, date: 2025-04-12, purpose: agency commission, sources: [s-corr], credibility: 2}
  - {id: q2, from: acc-reef, to: acc-quillon, amount: 243000, date: 2025-04-15, purpose: capital contribution, sources: [s-corr], credibility: 2}
