  - {id: acc-trader, owner: trader, kind: bank, number: TC88 2200 9055 1201, institution: Thornwick Merchant Bank, sources: [s-corr], credibility: 2}
  - {id: acc-reef, owner: reef, kind: bank, number: KI42 9900 3011 7001, institution: Kessel Offshore Bank, sources: [s-corr], credibility: 2}
  - {id: acc-quillon, owner: quillon, kind: bank, number: KI42 9900 3055 2001, institution: Kessel Offshore Bank, sources: [s-corr, s-bank], credibility: 2}
  - {id: acc-farm, owner: farm, kind: bank, sources: [s-corr], credibility: 2}
  - {id: acc-shipping, owner: shipping, kind: bank, sources: [s-corr], credibility: 2}

transactions:
  # first shipment: 480 000 invoiced, about 307 500 at the market price
  - {id: p1, from: acc-importer, to: acc-trader, amount: 480000, date: 2025-03-06, purpose: invoice TC-2025-031, sources: [s-bank], credibility: 1}
  - {id: g1, from: acc-trader, to: acc-farm, amount: 180000, date: 2025-03-07, purpose: wheat purchase, sources: [s-corr], credibility: 2}
  - {id: f1, from: acc-trader, to: acc-shipping, amount: 38000, date: 2025-03-07, purpose: freight MV Avel Tern, sources: [s-corr], credibility: 2}
  - {id: k1, from: acc-trader, to: acc-reef, amount: 250000, date: 2025-03-08, purpose: agency commission, sources: [s-corr], credibility: 2}
