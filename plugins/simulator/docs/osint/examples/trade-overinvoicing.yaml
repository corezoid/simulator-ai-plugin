# Invented case. An importer pays inflated invoices to a foreign trader; the
# excess moves through two offshore companies and returns to the importer as
# a "loan". The trader and one offshore company own each other.
case:
  id: trade-overinvoicing
  title: Grain imports of Sant Erro Agro Import
  question: Why does Sant Erro Agro Import pay well above the market for grain, and where does the difference go?
  synthetic: true
  currency: USD
  note: Every person, company, vessel, document and payment here is invented.

sources:
  - {id: s-customs, title: Customs declarations, kind: registry, reliability: A, retrieved: 2025-08-04}
  - {id: s-bank, title: Bank statements of the importer, kind: bank, reliability: A}
  - {id: s-corr, title: Correspondent bank payment records, kind: bank, reliability: B}
  - {id: s-registry, title: Company registry extracts, kind: registry, reliability: B, retrieved: 2025-08-01}
  - {id: s-leak, title: Leaked offshore incorporation files, kind: leak, reliability: C}
  - {id: s-market, title: Commodity price index, kind: corporate, reliability: A, url: "https://prices.example/wheat"}

entities:
  - id: importer
    type: organization
    title: Sant Erro Agro Import LLC
    attrs: {legal_form: LLC, reg_number: SE-770310, tax_id: EF-TAX-4410077, country: Erro Federation, incorporated: 2012-10-08, status: active,
            industry: grain trade, address: "22 Market Hill, Sant Erro", website: "https://seagro.example"}
    sources: [s-registry, s-customs]
    credibility: 1
  - id: owner
    type: person
    title: Velko Marand
    attrs: {dob: 1971-07-26, nationality: Erro Federation, occupation: company owner, tax_id: EF-TAX-1971072}
    sources: [s-registry]
    credibility: 1
  - id: trader
    type: organization
    title: Thornwick Commodities Ltd
    attrs: {legal_form: Ltd, reg_number: TW-905512, country: Thornwick Commonwealth, incorporated: 2022-03-15, status: active,
            industry: commodity trading, address: "5 Station Square, Thornwick"}
    sources: [s-registry, s-customs]
    credibility: 1
  - id: trader-director
    type: person
    title: Pelis Ormoor
    attrs: {dob: 1985-01-09, nationality: Thornwick Commonwealth, occupation: company director}
    sources: [s-registry]
    credibility: 1
  - id: reef
    type: organization
    title: Calder Reef Holdings Inc
    attrs: {legal_form: Inc, reg_number: KI-OFF-30117, country: Kessel Isles, incorporated: 2021-11-30, status: active, industry: holding company,
            registered_agent: Tidewater Trust Company}
    sources: [s-leak]
    credibility: 2
  - id: quillon
    type: organization
    title: Quillon Trade Finance LP
    attrs: {legal_form: LP, reg_number: KI-OFF-30552, country: Kessel Isles, incorporated: 2022-02-01, status: active, industry: lending,
            registered_agent: Tidewater Trust Company}
    sources: [s-leak, s-corr]
    credibility: 2
  - id: farm
    type: organization
    title: Nordhaven Grain Cooperative
    attrs: {legal_form: cooperative, reg_number: NH-100233, country: Nordhaven Union, incorporated: 1987-09-01, status: active, industry: agriculture}
    sources: [s-corr]
    credibility: 2
  - id: shipping
    type: organization
    title: Avel Line Shipping Inc
    attrs: {legal_form: Inc, reg_number: PA-330871, country: Avelan Republic, incorporated: 2001-05-12, status: active, industry: sea freight}
    sources: [s-customs, s-corr]
    credibility: 1
  - id: vessel
    type: asset
    title: MV Avel Tern, bulk carrier
    attrs: {kind: vessel, identifier: IMO SYN0004417, country: Avelan Republic}
    sources: [s-customs]
    credibility: 1
  - id: inv1
    type: document
    title: Invoice TC-2025-031, 1 500 t milling wheat
    attrs: {kind: commercial invoice, number: TC-2025-031, date: 2025-03-04, issuer: Thornwick Commodities Ltd}
    sources: [s-customs]
    credibility: 1
    note: Invoiced at 320 USD per tonne; the index for the week was 205.
  - id: inv2
    type: document
    title: Invoice TC-2025-047, 1 500 t milling wheat
    attrs: {kind: commercial invoice, number: TC-2025-047, date: 2025-04-08, issuer: Thornwick Commodities Ltd}
    sources: [s-customs]
    credibility: 1
    note: Invoiced at 320 USD per tonne; the index for the week was 210.
  - id: loan-doc
    type: document
    title: Loan agreement QTF-L-09
    attrs: {kind: loan agreement, number: QTF-L-09, date: 2025-03-17, issuer: Quillon Trade Finance LP}
    sources: [s-bank]
    credibility: 2
    note: Unsecured, no repayment schedule, 1 % interest.

relations:
  - {id: r-own-importer, from: owner, to: importer, type: owns, share: 100, sources: [s-registry], credibility: 1}
  - {id: r-dir-importer, from: owner, to: importer, type: director, sources: [s-registry], credibility: 1}
