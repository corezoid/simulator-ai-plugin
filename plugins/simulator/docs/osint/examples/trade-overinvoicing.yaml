  - {id: r-dir-trader, from: trader-director, to: trader, type: director, sources: [s-registry], credibility: 1}
  - {id: r-inv1, from: inv1, to: importer, type: mentions, sources: [s-customs], credibility: 1}
  - {id: r-inv2, from: inv2, to: importer, type: mentions, sources: [s-customs], credibility: 1}
