events:
  - {id: e1, date: 2022-03-15, title: "Thornwick Commodities is incorporated, six weeks after Quillon Trade Finance", entities: [trader, quillon], sources: [s-registry, s-leak], credibility: 2}
  - {id: e2, date: 2025-03-04, title: First wheat invoice at 56 % above the price index, entities: [importer, trader, inv1], sources: [s-customs, s-market], credibility: 1}
  - {id: e3, date: 2025-03-17, title: Importer signs an unsecured loan with Quillon Trade Finance, entities: [importer, quillon, loan-doc], sources: [s-bank], credibility: 2}
  - {id: e4, date: 2025-04-08, title: Second wheat invoice at 52 % above the price index, entities: [importer, trader, inv2], sources: [s-customs, s-market], credibility: 1}

hypotheses:
  - id: h1
    statement: The invoices are inflated to move money out of the importer, and the excess returns to it as a loan.
    status: supported
    evidence: [p1, k1, q1, l1, p2, k2, q2, l2, inv1, inv2]
  - id: h2
    statement: Velko Marand controls both ends of the trade through Calder Reef Holdings.
    status: open
    evidence: [r-own-reef, r-reef-quillon, r-quillon-trader]
    note: The offshore ownership comes from a leak (C); only the 40 % stake of Quillon in the trader is in a public registry.
