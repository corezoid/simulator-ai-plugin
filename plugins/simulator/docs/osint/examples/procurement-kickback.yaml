  - {id: t14, from: acc-authority, to: acc-official, amount: 4200, date: 2025-04-28, purpose: salary, sources: [s-bank], credibility: 1}
  - {id: t15, from: acc-authority, to: acc-official, amount: 4200, date: 2025-05-28, purpose: salary, sources: [s-bank], credibility: 1}

