  - {id: t10, from: acc-holding, to: acc-spouse, amount: 345000, date: 2025-03-11, purpose: shareholder loan, sources: [s-bank], credibility: 1}
  - {id: t11, from: acc-holding, to: acc-spouse, amount: 230000, date: 2025-04-22, purpose: shareholder loan, sources: [s-bank], credibility: 1}
