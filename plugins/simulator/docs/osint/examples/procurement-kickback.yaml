hypotheses:
  - id: h1
    statement: Thirty percent of each contract payment was returned through Greywater Consulting to the family of the official who ran the tender.
    status: open
    evidence: [t06, t07, t08, t09, t10, t11, r-family]
    note: The payments are documented; the link to the family rests on the ownership chain below.
  - id: h2
    statement: Marenna Halvik is the beneficial owner of Greywater Consulting through Halden Family Holdings.
    status: open
    evidence: [r-holding, r-spouse, r-office1, r-office2]
    note: Both ownership records come from a leak (D). A registry confirmation would raise this to B.
  - id: h3
    statement: The villa was paid for with the money received from the holding.
    status: supported
    evidence: [t10, t11, t12]
