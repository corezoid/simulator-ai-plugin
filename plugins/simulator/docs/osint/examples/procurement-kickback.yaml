transactions:
  # the contract is paid in two stages
  - {id: t01, from: acc-authority, to: acc-contractor, amount: 1200000, date: 2025-03-03, purpose: "RA-2025-014/C advance, 60%", sources: [s-bank, s-tender], credibility: 1}
