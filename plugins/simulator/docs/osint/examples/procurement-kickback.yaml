  - {id: t04, from: acc-contractor, to: acc-machinery, amount: 310000, date: 2025-03-12, purpose: paver and roller rental, sources: [s-bank], credibility: 1}
  - {id: t05, from: acc-contractor, to: acc-asphalt, amount: 280000, date: 2025-04-20, purpose: asphalt mix, sources: [s-bank], credibility: 1}
  # 30 % of each stage goes to the "consultant" within two days
